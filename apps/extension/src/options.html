<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Extension Options</title>
  </head>
  <body>
    <h1>Extension Configuration</h1>
    <label>Page A URL: <input id="pageA" style="width:400px"/></label><br/>
    <label>Page B URL: <input id="pageB" style="width:400px"/></label><br/>
    <h2>Mappings</h2>
    <div id="mappings"></div>
    <button id="addMapping">Add mapping</button>
    <h2>Credentials</h2>
    <label>Login URL: <input id="loginUrl" style="width:400px"/></label><br/>
    <label>Username: <input id="username"/></label>
    <label>Password: <input id="password" type="password"/></label><br/>
    <button id="save">Save</button>
    <script src="options.js"></script>
  </body>
  </html>
