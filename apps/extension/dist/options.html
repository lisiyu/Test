<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Extension Options</title>
  </head>
  <body>
    <h1>Extension Configuration</h1>
    <fieldset>
      <legend>Page A</legend>
      <label>Page A URL: <input id="pageA" style="width:400px"/></label><br/>
      <label>Page A Login URL: <input id="pageALoginUrl" style="width:400px"/></label><br/>
      <label><input id="autoLoginA" type="checkbox"/> Enable auto-login on Page A</label><br/>
      <label>Username selector: <input id="pageAUsernameSelector" style="width:300px"/></label><br/>
      <label>Password selector: <input id="pageAPasswordSelector" style="width:300px"/></label><br/>
      <label>Submit selector: <input id="pageASubmitSelector" style="width:300px"/></label><br/>
    </fieldset>
    <fieldset id="pageBSettings">
      <legend>Page B</legend>
      <label>Page B URL: <input id="pageB" style="width:400px"/></label><br/>
      <label>Page B Login URL: <input id="pageBLoginUrl" style="width:400px"/></label><br/>
      <label><input id="autoLoginB" type="checkbox"/> Enable auto-login on Page B</label><br/>
      <label>Username selector: <input id="pageBUsernameSelector" style="width:300px"/></label><br/>
      <label>Password selector: <input id="pageBPasswordSelector" style="width:300px"/></label><br/>
      <label>Submit selector: <input id="pageBSubmitSelector" style="width:300px"/></label><br/>
    </fieldset>
    <fieldset>
      <legend>Page B Target</legend>
      <label>Target Type:
        <select id="pageBTargetType">
          <option value="web">Web Page</option>
          <option value="api">API Endpoint</option>
        </select>
      </label><br/>
      <div style="margin-top:8px;color:#555;max-width:600px;">
        API 模式下不会打开页面 B，页面 B 配置仅在 Web 模式下生效。
      </div>
      <label>Target Type:
        <select id="pageBTargetType">
          <option value="web">Web Page</option>
          <option value="api">API Endpoint</option>
        </select>
      </label><br/>
      <div id="apiSettings" style="display:none;">
        <label>API URL: <input id="apiUrl" style="width:400px"/></label><br/>
        <label>Method:
          <select id="apiMethod"><option>POST</option><option>PUT</option><option>PATCH</option><option>GET</option></select>
        </label><br/>
        <label>Headers (JSON):</label><br/>
        <textarea id="apiHeaders" rows="4" cols="60"></textarea><br/>
        <div id="apiHeadersError" style="color:#b00;margin-top:6px;display:none;"></div>
        <div id="apiStatus" style="margin-top:12px;padding:8px;border:1px solid #ccc;background:#f9f9f9;white-space:pre-wrap;font-size:13px;"></div>
      </div>
    </fieldset>
    <h2>Mappings</h2>
    <div id="mappings"></div>
    <button id="addMapping">Add mapping</button>
    <h2>Credentials</h2>
    <label>Credential Type:
      <select id="credentialType">
        <option value="password">Username / Password</option>
        <option value="certificate">Certificate</option>
      </select>
    </label><br/>
    <div id="passwordCredentials">
      <label>Username: <input id="username"/></label><br/>
      <label>Password: <input id="password" type="password"/></label><br/>
    </div>
    <div id="certificateCredentials" style="display:none;">
      <label>Certificate value:</label><br/>
      <textarea id="certificate" rows="4" cols="60"></textarea><br/>
    </div>
    <button id="save">Save</button>
    <script src="options.js"></script>
  </body>
</html>
